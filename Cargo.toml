[workspace]
resolver = "2"
members = ["crates/smm-core", "crates/smm-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Blackshield-Company/skyrim-mod-manager"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
